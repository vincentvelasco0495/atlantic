[build]
  command = "npm run build"
  publish = "dist"

# Optional: proxy /api to your Laravel backend on the same Netlify domain.
# Uncomment and replace YOUR-BACKEND-URL after deploying the backend.
# Must stay ABOVE the SPA fallback rule below.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback — do not put this above /api redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
